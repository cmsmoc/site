<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Cards Studio · Editor de Destaques</title>
<!-- Metadados de Compartilhamento (Open Graph) -->
<meta property="og:type" content="website">
<meta property="og:title" content="CMS Cards Studio · Editor de Destaques e Pop-ups">
<meta property="og:description" content="Gerador e editor de cards de comunicação oficial, pop-ups e carrossel de destaques do CMS Montes Claros.">
<meta property="og:image" content="https://www.cmsmoc.com/thumb_reuniao.webp">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --cms-navy:#0D2E5A;--cms-blue:#157BAB;--cms-yellow:#F5C400;--cms-green:#1E8A4A;--cms-off:#F4F6F9;--cms-border:#E2E8F0;
 --font-display:'Montserrat',Helvetica,Arial,sans-serif;--font-body:'Open Sans',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:#08182E;color:#FFFFFF;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.stripe{height:4px;background:linear-gradient(to right,var(--cms-yellow) 33.3%,var(--cms-green) 33.3% 66.6%,var(--cms-blue) 66.6%);width:100%;flex-shrink:0}
header.studio-header{background:var(--cms-navy);padding:10px 20px;border-bottom:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0}
.logo-title{display:flex;align-items:center;gap:12px}
.logo-title img{height:30px}
.logo-title h1{font-family:var(--font-display);font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:0.5px}
.logo-title span{font-size:11px;color:rgba(255,255,255,0.6);font-weight:600}

.action-bar{display:flex;align-items:center;gap:8px}
.btn{font-family:var(--font-display);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:8px 14px;border-radius:6px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s ease;text-decoration:none}
.btn-primary{background:var(--cms-yellow);color:var(--cms-navy)}
.btn-primary:hover{background:#ffdb4d;transform:translateY(-1px)}
.btn-blue{background:var(--cms-blue);color:#fff}
.btn-blue:hover{background:#1B6CB5}
.btn-green{background:var(--cms-green);color:#fff}
.btn-green:hover{background:#166534}
.btn-dark{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.btn-dark:hover{background:rgba(255,255,255,0.2)}

.studio-main{flex:1;display:flex;overflow:hidden}

/* COLUNA ESQUERDA: PRESETS & BIBLIOTECA */
aside.left-pane{width:300px;background:#0A1D36;border-right:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;flex-shrink:0}
.pane-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.1)}
.pane-tab{flex:1;padding:12px;font-family:var(--font-display);font-size:11px;font-weight:800;text-transform:uppercase;background:transparent;color:rgba(255,255,255,0.5);border:none;cursor:pointer;text-align:center;border-bottom:2px solid transparent}
.pane-tab.active{color:var(--cms-yellow);border-bottom-color:var(--cms-yellow);background:rgba(255,255,255,0.03)}
.pane-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

.preset-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all 0.15s ease}
.preset-card:hover{background:rgba(255,255,255,0.1);border-color:var(--cms-yellow);transform:translateX(3px)}
.preset-name{font-family:var(--font-display);font-size:11.5px;font-weight:800;color:#FFFFFF;margin-bottom:3px}
.preset-desc{font-size:10.5px;color:rgba(255,255,255,0.6);line-height:1.3}

.saved-card-item{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.saved-card-item.selected{border-color:var(--cms-yellow);background:rgba(245,196,0,0.08)}
.saved-head{display:flex;justify-content:space-between;align-items:center}
.saved-title{font-family:var(--font-display);font-size:12px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.saved-dest{display:flex;gap:4px;flex-wrap:wrap}
.dest-badge{font-size:8.5px;font-weight:800;padding:2px 5px;border-radius:3px;text-transform:uppercase}
.dest-topo{background:#1E8A4A;color:#fff}
.dest-pop{background:#157BAB;color:#fff}

/* PALCO CENTRAL: CANVAS */
.stage-center{flex:1;background:#051020;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:20px;overflow:hidden}
.canvas-wrap{box-shadow:0 15px 40px rgba(0,0,0,0.6);border-radius:6px;overflow:hidden;max-height:85vh;display:flex;align-items:center;justify-content:center}
canvas#studioCanvas{display:block;max-width:100%;max-height:80vh;object-fit:contain}

.stage-bottom-bar{position:absolute;bottom:12px;background:rgba(13,46,90,0.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);border-radius:30px;padding:6px 16px;display:flex;align-items:center;gap:12px;font-size:11px}

/* COLUNA DIREITA: CONTROLES */
aside.right-pane{width:320px;background:#0A1D36;border-left:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;flex-shrink:0}
.ctl-header{padding:14px;border-bottom:1px solid rgba(255,255,255,0.1);font-family:var(--font-display);font-weight:900;font-size:12px;text-transform:uppercase;color:var(--cms-yellow);letter-spacing:0.5px}
.ctl-scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}

.ctl-group{display:flex;flex-direction:column;gap:5px}
.ctl-label{font-family:var(--font-display);font-size:10px;font-weight:800;text-transform:uppercase;color:rgba(255,255,255,0.7);letter-spacing:0.5px}
.ctl-input, .ctl-select, .ctl-textarea{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:5px;padding:7px 10px;color:#fff;font-family:var(--font-body);font-size:11.5px;outline:none}
.ctl-input:focus, .ctl-select:focus, .ctl-textarea:focus{border-color:var(--cms-yellow)}
.ctl-textarea{resize:vertical;min-height:55px}

.color-pickers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.col-btn{height:30px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all 0.15s ease}
.col-btn.selected{border-color:#fff;transform:scale(1.08)}
.col-amarelo{background:#FFCC2A}
.col-azul{background:#157BAB}
.col-verde{background:#177E40}
.col-branco{background:#F5F6F2}
.col-marinho{background:#0D2E5A}

.dest-switches{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.switch-row{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.switch-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--cms-yellow);cursor:pointer}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E8A4A;color:#fff;font-family:var(--font-display);font-weight:800;font-size:12px;padding:10px 20px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:999;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
/* click-to-edit */
#studioCanvas{cursor:crosshair;transition:box-shadow 0.2s}
#studioCanvas:hover{box-shadow:0 0 0 2px var(--cms-yellow)}
.canvas-click-hint{position:absolute;top:12px;right:12px;font-family:var(--font-display);font-size:10px;font-weight:800;color:rgba(255,255,255,0.4);letter-spacing:.4px;text-transform:uppercase;pointer-events:none}
@keyframes fieldFlash{0%{background:rgba(245,196,0,0.25)}100%{background:rgba(255,255,255,0.08)}}
.field-flash{animation:fieldFlash 0.6s ease-out}
/* header toggles */
.header-toggles{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.htoggle-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.8)}
.htoggle-row input[type="checkbox"]{width:14px;height:14px;accent-color:var(--cms-yellow);cursor:pointer}
</style>
</head>
<body>
<div class="stripe"></div>
<header class="studio-header">
  <div class="logo-title">
    <img src="https://cmsmoc.github.io/secretariaexecutiva/logo/logohwh.png" alt="CMS">
    <div>
      <h1>CMS Cards Studio</h1>
      <span>Editor de Destaques, Pop-ups e Carrossel</span>
    </div>
  </div>
  <div class="action-bar">
    <button class="btn btn-dark" id="btnSalvarLib"><span>💾</span> Salvar Card</button>
    <button class="btn btn-primary" id="btnExportJpeg"><span>📥</span> Baixar JPEG</button>
    <button class="btn btn-primary" id="btnExportPng"><span>📥</span> Baixar PNG</button>
    <button class="btn btn-green" id="btnPublicarSite"><span>🚀</span> Publicar Destaques</button>
    <a href="admin-sandbox.html" target="_blank" class="btn btn-blue"><span>🧪</span> Sandbox</a>
  </div>
</header>

<div class="studio-main">
  <!-- COLUNA ESQUERDA -->
  <aside class="left-pane">
    <div class="pane-tabs">
      <button class="pane-tab active" id="tabPresetsBtn" onclick="trocarAbaEsquerda('presets')">Modelos Rápidos</button>
      <button class="pane-tab" id="tabSavedBtn" onclick="trocarAbaEsquerda('saved')">Meus Cards (<span id="savedCount">0</span>)</button>
    </div>
    
    <div class="pane-body" id="panePresets">
      <!-- Injetado dinamicamente -->
    </div>

    <div class="pane-body" id="paneSaved" style="display:none">
      <div style="display:flex;gap:6px;margin-bottom:4px">
        <button class="btn btn-dark" style="flex:1;padding:6px" onclick="criarNovoCard()">+ Novo</button>
        <button class="btn btn-dark" style="padding:6px" onclick="duplicarCardAtual()">Duplicar</button>
        <button class="btn btn-dark" style="padding:6px" onclick="excluirCardAtual()">Excluir</button>
      </div>
      <div id="savedCardsList" style="display:flex;flex-direction:column;gap:8px"></div>
      <div style="margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,0.1);display:flex;gap:6px">
        <button class="btn btn-dark" style="flex:1;font-size:10px;padding:6px" onclick="exportarJsonLib()">Exportar JSON</button>
        <label class="btn btn-dark" style="flex:1;font-size:10px;padding:6px;text-align:center">Importar JSON<input type="file" id="importJsonInput" accept=".json" hidden></label>
      </div>
    </div>
  </aside>

  <!-- PALCO CENTRAL -->
  <section class="stage-center">
    <div class="canvas-wrap">
      <canvas id="studioCanvas" width="880" height="1100" title="Clique para editar o campo"></canvas>
    </div>
    <div class="canvas-click-hint">✏ clique para editar</div>
    <div class="stage-bottom-bar">
      <span>Formato:</span>
      <select id="selFmt" class="ctl-select" style="width:auto;padding:3px 8px;font-size:11px" onchange="alterarFormato(this.value)">
        <option value="4:5">4:5 · Feed / Pop-up</option>
        <option value="16:9">16:9 · Banner Topo</option>
        <option value="1:1">1:1 · Quadrado</option>
        <option value="9:16">9:16 · Stories</option>
      </select>
      <span style="margin-left:8px">Marca:</span>
      <input type="text" id="inpHandle" class="ctl-input" style="width:140px;padding:3px 8px;font-size:11px" value="CMS Montes Claros">
      <span style="margin-left:auto;color:rgba(255,255,255,0.6)" id="saveStatus">Auto-salvo localmente</span>
    </div>
  </section>

  <!-- COLUNA DIREITA: CONTROLES -->
  <aside class="right-pane">
    <div class="ctl-header">Personalizar Card Selecionado</div>
    <div class="ctl-scroll">
      
      <!-- DESTINOS NO SITE -->
      <div class="ctl-group">
        <label class="ctl-label" style="color:var(--cms-yellow)">Destino de Publicação no Site</label>
        <div class="dest-switches">
          <label class="switch-row">
            <span>🔝 Topo da Index (Carrossel)</span>
            <input type="checkbox" id="chkDestTopo" onchange="atualizarCardAtual()">
          </label>
          <label class="switch-row">
            <span>🌐 Pop-up da Página Inicial</span>
            <input type="checkbox" id="chkDestPopIndex" onchange="atualizarCardAtual()">
          </label>
          <label class="switch-row">
            <span>📋 Pop-up de Presença (Reunião)</span>
            <input type="checkbox" id="chkDestPopReuniao" onchange="atualizarCardAtual()">
          </label>
        </div>
      </div>

      <!-- CONTEÚDO -->
      <div class="ctl-group">
        <label class="ctl-label">Layout Base</label>
        <select id="selLayout" class="ctl-select" onchange="atualizarCardAtual()">
          <option value="statement">Declaração de Impacto</option>
          <option value="number">Destaque com Número</option>
          <option value="mega">Mega Palavra (Maximalista)</option>
          <option value="quote">Citação com Aspas</option>
          <option value="list">Lista de Tópicos / Pauta</option>
          <option value="cta">Chamada com Botão</option>
        </select>
      </div>

      <!-- CABEÇALHO & MARCA -->
      <div class="ctl-group">
        <label class="ctl-label" style="color:var(--cms-yellow)">Cabeçalho do Card</label>
        <div class="header-toggles">
          <label class="htoggle-row">
            <span>🔖 Mostrar cabeçalho</span>
            <input type="checkbox" id="chkUi" onchange="atualizarCardAtual()" checked>
          </label>
          <label class="htoggle-row" id="rowUiLine">
            <span style="padding-left:12px">― Linha separadora</span>
            <input type="checkbox" id="chkUiLine" onchange="atualizarCardAtual()" checked>
          </label>
          <label class="htoggle-row" id="rowUiNum">
            <span style="padding-left:12px">🔢 Numeração (ex: 01/03)</span>
            <input type="checkbox" id="chkUiNum" onchange="atualizarCardAtual()" checked>
          </label>
          <label class="htoggle-row" id="rowUiHandle">
            <span style="padding-left:12px">🏷 Texto da marca</span>
            <input type="checkbox" id="chkUiHandle" onchange="atualizarCardAtual()" checked>
          </label>
        </div>
      </div>

      <div class="ctl-group">
        <label class="ctl-label">Título Principal (Use *destaque*)</label>
        <textarea id="txtHead" class="ctl-textarea" placeholder="Digite seu texto..." oninput="atualizarCardAtual()"></textarea>
      </div>

      <div class="ctl-group">
        <label class="ctl-label">Texto de Apoio / Subtítulo</label>
        <textarea id="txtSup" class="ctl-textarea" placeholder="Detalhes opcionais..." oninput="atualizarCardAtual()"></textarea>
      </div>

      <div class="ctl-group" id="grpNum" style="display:none">
        <label class="ctl-label">Número em Destaque</label>
        <input type="text" id="inpNum" class="ctl-input" placeholder="Ex: 50%, 01, 273ª" oninput="atualizarCardAtual()">
      </div>

      <div class="ctl-group" id="grpItems" style="display:none">
        <label class="ctl-label">Lista de Tópicos (Uma linha por item)</label>
        <textarea id="txtItems" class="ctl-textarea" style="min-height:75px" placeholder="Título: detalhe..." oninput="atualizarCardAtual()"></textarea>
      </div>

      <div class="ctl-group">
        <label class="ctl-label">Botão de Ação (CTA)</label>
        <input type="text" id="inpCta" class="ctl-input" placeholder="Ex: Entrar na Reunião, Participe..." oninput="atualizarCardAtual()">
      </div>

      <!-- CORES & ESTILO -->
      <div class="ctl-group">
        <label class="ctl-label">Cor do Card</label>
        <div class="color-pickers">
          <button class="col-btn col-amarelo" onclick="escolherCor('amarelo')"></button>
          <button class="col-btn col-azul" onclick="escolherCor('azul')"></button>
          <button class="col-btn col-verde" onclick="escolherCor('verde')"></button>
          <button class="col-btn col-branco" onclick="escolherCor('branco')"></button>
          <button class="col-btn col-marinho selected" onclick="escolherCor('marinho')"></button>
        </div>
      </div>

      <div class="ctl-group">
        <label class="ctl-label">Objeto Gráfico</label>
        <select id="selObj" class="ctl-select" onchange="atualizarCardAtual()">
          <option value="auto">Automático</option>
          <option value="emblema">Emblema Institucional</option>
          <option value="sol">Sol do Norte</option>
          <option value="linhas">Linhas Dinâmicas</option>
          <option value="aspas">Aspas Clássicas</option>
          <option value="seta">Seta de Ação</option>
          <option value="contorno">Contorno Geométrico</option>
          <option value="none">Nenhum</option>
        </select>
      </div>

      <div class="ctl-group">
        <label class="ctl-label">Estilo do Rodapé</label>
        <select id="selFst" class="ctl-select" onchange="atualizarCardAtual()">
          <option value="tricolor">Tricolor Institucional</option>
          <option value="ondas">Ondas Duplas</option>
          <option value="ondas3">Ondas Triplas</option>
          <option value="suave">Onda Suave</option>
          <option value="reta">Reto Simples</option>
          <option value="minimal">Minimalista</option>
        </select>
      </div>

      <div class="ctl-group">
        <label class="ctl-label">Textura</label>
        <select id="selTex" class="ctl-select" onchange="atualizarCardAtual()">
          <option value="riso">Riso Premium</option>
          <option value="fine">Grão Fino</option>
          <option value="paper">Papel Texturado</option>
          <option value="strong">Grão Forte</option>
          <option value="none">Flat (Sem Textura)</option>
        </select>
      </div>

      <!-- IMAGEM DE FUNDO -->
      <div class="ctl-group">
        <label class="ctl-label">Imagem de Fundo (Opcional)</label>
        <input type="file" id="inpBgFile" accept="image/*" class="ctl-input">
        <div style="display:flex;gap:4px;margin-top:4px">
          <input type="text" id="inpBgUrl" placeholder="Ou cole URL da foto..." class="ctl-input" style="flex:1">
          <button class="btn btn-dark" style="padding:4px 8px" onclick="aplicarBgUrl()">Usar</button>
          <button class="btn btn-dark" style="padding:4px 8px" onclick="removerBg()">✕</button>
        </div>
      </div>

    </div>
  </aside>
</div>

<div class="toast" id="toastMsg" style="display:none"></div>

<script>

'use strict';
/* ═════ PALETA & OBJETOS — geometria derivada da marca ═════ */
const MONOF='"Montserrat",Helvetica,Arial,sans-serif';
const Y='#FFCC2A',BL='#157BAB',G1='#1D9C4F',G2='#177E40',NV='#0D2E5A',INK='#0A0A0A';
const TH={
 amarelo:{bg:Y,fg:INK,mute:'rgba(10,10,10,.74)',acc:BL,btn:INK,btnFg:Y,dark:false,s:'#fff',k:BL,p:'#fff',g1:G1,g2:G2,bb:BL,bf:NV,tn:'#EDB914'},
 branco:{bg:'#F5F6F2',fg:INK,mute:'rgba(10,10,10,.66)',acc:BL,btn:BL,btnFg:'#fff',dark:false,s:Y,k:BL,p:BL,g1:G1,g2:G2,bb:G1,bf:Y,tn:'#E6E8E1'},
 azul:{bg:BL,fg:'#fff',mute:'rgba(255,255,255,.82)',acc:Y,btn:Y,btnFg:INK,dark:true,s:Y,k:'#0E5F86',p:'#fff',g1:G1,g2:G2,bb:G1,bf:Y,tn:'#0F6A94'},
 verde:{bg:G2,fg:'#fff',mute:'rgba(255,255,255,.82)',acc:Y,btn:Y,btnFg:INK,dark:true,s:Y,k:BL,p:'#fff',g1:NV,g2:BL,bb:BL,bf:Y,tn:'#13693A'},
 marinho:{bg:NV,fg:'#fff',mute:'rgba(255,255,255,.78)',acc:Y,btn:Y,btnFg:INK,dark:true,s:Y,k:BL,p:'#fff',g1:G1,g2:G2,bb:G1,bf:Y,tn:'#143F73'}

/* ───── divisão e parsing ───── */
function sentences(text){

}

}

}

function parseCard(card,o,total){
  let text=card.text, tags={};

  const info={head:'',support:'',items:[],cta:null,num:null,quote:false};
  const rest=[]; 
  for(const ln of lines){
    if(/^[-•–]\s+/.test(ln)){ const t=ln.replace(/^[-•–]\s+/,''); const i=t.indexOf(': '); info.items.push(i>0?{t:t.slice(0,i),d:t.slice(i+2)}:{t,d:''}); }

/* ═══════════════════════════════════════════════════════════════
   APP STATE & CONTROLE DO CMS CARDS STUDIO
   ═══════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'cms_cards_studio_lib_v2';
let appCards = [];
let currentIndex = 0;
let currentTheme = 'marinho';
let activeBg = null;

function carregarBiblioteca() {
  try {
    const salvo = localStorage.getItem(STORAGE_KEY);
    if (salvo) {
      appCards = JSON.parse(salvo);
    }
  } catch(e){}
  
  if (!appCards || appCards.length === 0) {
    // Inicializa com os primeiros 3 presets para não começar vazio
    appCards = [
      JSON.parse(JSON.stringify(PRESETS[0])),
      JSON.parse(JSON.stringify(PRESETS[1])),
      JSON.parse(JSON.stringify(PRESETS[2]))
    ];
  }
  currentIndex = 0;
}

function salvarBiblioteca() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appCards));
    const stat = document.getElementById('saveStatus');
    if(stat) stat.textContent = 'Salvo às ' + new Date().toLocaleTimeString('pt-BR');
  } catch(e){}
  renderizarListaSalvos();
}

function getCardAtual() {
  if (!appCards[currentIndex]) {
    appCards[currentIndex] = JSON.parse(JSON.stringify(PRESETS[0]));
  }
  return appCards[currentIndex];
}

function trocarAbaEsquerda(aba) {
  const pPresets = document.getElementById('panePresets');
  const pSaved = document.getElementById('paneSaved');
  const bP = document.getElementById('tabPresetsBtn');
  const bS = document.getElementById('tabSavedBtn');

  if (aba === 'presets') {
    pPresets.style.display = 'flex';
    pSaved.style.display = 'none';
    bP.classList.add('active');
    bS.classList.remove('active');
  } else {
    pPresets.style.display = 'none';
    pSaved.style.display = 'flex';
    bP.classList.remove('active');
    bS.classList.add('active');
  }
}

function renderizarPresets() {
  const ctn = document.getElementById('panePresets');
  ctn.innerHTML = '';
  PRESETS.forEach((p, idx) => {
    const el = document.createElement('div');
    el.className = 'preset-card';
    el.onclick = () => aplicarPreset(idx);
    el.innerHTML = `
      <div class="preset-name">${p.name}</div>
      <div class="preset-desc">${p.head.replace(/[*_]/g, '')}</div>
    `;
    ctn.appendChild(el);
  });
}

function aplicarPreset(idx) {
  const preset = JSON.parse(JSON.stringify(PRESETS[idx]));
  preset.id = Date.now() + Math.random().toString(36).slice(2,5);
  appCards.push(preset);
  currentIndex = appCards.length - 1;
  preencherFormularioComCard(preset);
  desenharCardAtual();
  salvarBiblioteca();
  trocarAbaEsquerda('saved');
  mostrarToast('Modelo carregado!');
}

function renderizarListaSalvos() {
  const ctn = document.getElementById('savedCardsList');
  const countEl = document.getElementById('savedCount');
  if (countEl) countEl.textContent = appCards.length;
  if (!ctn) return;

  ctn.innerHTML = '';
  appCards.forEach((c, idx) => {
    const el = document.createElement('div');
    el.className = 'saved-card-item' + (idx === currentIndex ? ' selected' : '');
    el.onclick = (e) => {
      if (e.target.tagName !== 'INPUT') {
        selecionarCard(idx);
      }
    };

    let badges = '';
    if (c.dest_topo) badges += '<span class="dest-badge dest-topo">Topo</span>';
    if (c.dest_popup_index) badges += '<span class="dest-badge dest-pop">Pop Index</span>';
    if (c.dest_popup_reuniao) badges += '<span class="dest-badge dest-pop">Pop Reunião</span>';

    el.innerHTML = `
      <div class="saved-head">
        <span class="saved-title">${c.head ? c.head.replace(/[*_]/g, '') : 'Card Sem Título'}</span>
        <span style="font-size:10px;color:rgba(255,255,255,0.4)">#${idx + 1}</span>
      </div>
      <div class="saved-dest">${badges || '<span style="font-size:9px;color:rgba(255,255,255,0.4)">Nenhum destino ativo</span>'}</div>
    `;
    ctn.appendChild(el);
  });
}

function selecionarCard(idx) {
  currentIndex = idx;
  const c = getCardAtual();
  preencherFormularioComCard(c);
  desenharCardAtual();
  renderizarListaSalvos();
}

function preencherFormularioComCard(c) {
  document.getElementById('selLayout').value = c.layout || 'statement';
  document.getElementById('txtHead').value = c.head || '';
  document.getElementById('txtSup').value = c.sup || '';
  document.getElementById('inpNum').value = c.num || '';
  document.getElementById('txtItems').value = c.items || '';
  document.getElementById('inpCta').value = c.cta || '';
  document.getElementById('selFmt').value = c.fmt || '4:5';
  document.getElementById('selObj').value = c.obj || 'auto';
  document.getElementById('selFst').value = c.fst || 'tricolor';
  document.getElementById('selTex').value = c.tex || 'riso';
  document.getElementById('inpHandle').value = c.handle || 'CMS Montes Claros';

  document.getElementById('chkDestTopo').checked = !!c.dest_topo;
  document.getElementById('chkDestPopIndex').checked = !!c.dest_popup_index;
  document.getElementById('chkDestPopReuniao').checked = !!c.dest_popup_reuniao;

  // cabeçalho
  const uiOn = c.ui !== false;
  document.getElementById('chkUi').checked = uiOn;
  document.getElementById('chkUiLine').checked = c.ui_line !== false;
  document.getElementById('chkUiNum').checked = c.ui_num !== false;
  document.getElementById('chkUiHandle').checked = c.ui_handle !== false;
  ['rowUiLine','rowUiHandle','rowUiNum'].forEach(id => {
    const row = document.getElementById(id);
    if(row) row.style.opacity = uiOn ? '1' : '0.35';
  });

  escolherCor(c.theme || 'marinho', false);

  // Exibir campos específicos por layout
  const layout = c.layout;
  document.getElementById('grpNum').style.display = (layout === 'number') ? 'flex' : 'none';
  document.getElementById('grpItems').style.display = (layout === 'list') ? 'flex' : 'none';
}

function atualizarCardAtual() {
  const c = getCardAtual();
  c.layout = document.getElementById('selLayout').value;
  c.head = document.getElementById('txtHead').value;
  c.sup = document.getElementById('txtSup').value;
  c.num = document.getElementById('inpNum').value;
  c.items = document.getElementById('txtItems').value;
  c.cta = document.getElementById('inpCta').value;
  c.fmt = document.getElementById('selFmt').value;
  c.obj = document.getElementById('selObj').value;
  c.fst = document.getElementById('selFst').value;
  c.tex = document.getElementById('selTex').value;
  c.handle = document.getElementById('inpHandle').value;
  c.theme = currentTheme;

  c.dest_topo = document.getElementById('chkDestTopo').checked;
  c.dest_popup_index = document.getElementById('chkDestPopIndex').checked;
  c.dest_popup_reuniao = document.getElementById('chkDestPopReuniao').checked;

  // controles de cabeçalho
  c.ui = document.getElementById('chkUi').checked;
  c.ui_line = document.getElementById('chkUiLine').checked;
  c.ui_num = document.getElementById('chkUiNum').checked;
  c.ui_handle = document.getElementById('chkUiHandle').checked;
  // habilitar/desabilitar sub-toggles conforme o master
  const uiOn = c.ui;
  ['rowUiLine','rowUiHandle','rowUiNum'].forEach(id => {
    const row = document.getElementById(id);
    if(row) row.style.opacity = uiOn ? '1' : '0.35';
  });

  document.getElementById('grpNum').style.display = (c.layout === 'number') ? 'flex' : 'none';
  document.getElementById('grpItems').style.display = (c.layout === 'list') ? 'flex' : 'none';

  desenharCardAtual();
  salvarBiblioteca();
}

function escolherCor(cor, salvar = true) {
  currentTheme = cor;
  document.querySelectorAll('.col-btn').forEach(b => b.classList.remove('selected'));
  const btn = document.querySelector('.col-' + cor);
  if (btn) btn.classList.add('selected');
  if (salvar) atualizarCardAtual();
}

function alterarFormato(fmt) {
  const c = getCardAtual();
  c.fmt = fmt;
  desenharCardAtual();
  salvarBiblioteca();
}

function ceTextCard(c) {
  const h = (c.head || '').trim().replace(/\s*\n\s*/g, ' | ');
  const sp = (c.sup || '').trim().replace(/\s*\n\s*/g, ' ');
  if (c.layout === 'mega') return h;
  if (c.layout === 'quote') return '“' + h + '”' + (sp ? '\n' + sp : '');
  if (c.layout === 'number') return (c.num || '1') + '. ' + h + (sp ? '\n' + sp : '');
  if (c.layout === 'list') return h + '\n' + (c.items || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => '- ' + l).join('\n');
  if (c.layout === 'cta') return h + (sp ? '\n' + sp : '') + '\n> ' + (c.cta || 'Participe');
  return h + (sp ? '\n' + sp : '');
}

function montarCardParaEngine(c) {
  return {
    text: ceTextCard(c),
    ci: 0,
    n: 1,
    ov: { obj: c.obj || 'auto', size: (c.osz || 100) / 100, dx: (c.odx || 0) / 100, dy: (c.ody || 0) / 100 },
    bg: c.bg || null
  };
}

function montarOptsParaEngine(c) {
  return {
    fmt: c.fmt || '4:5',
    style: 'varied',
    theme: c.theme || 'marinho',
    texture: c.tex || 'riso',
    tex: c.texA !== undefined ? c.texA : 55,
    handle: c.handle || 'CMS Montes Claros',
    ctaText: '',
    objects: true,
    autoEm: true,
    ui: c.ui !== undefined ? c.ui : true,
    ui_line: c.ui_line !== false,
    ui_num: c.ui_num !== false,
    ui_handle: c.ui_handle !== false,
    logo: c.logo || 'h',
    intro: false,
    f: {
      st: c.fst || 'tricolor',
      h: c.fh || 100,
      amp: c.fam || 100,
      fc: c.ffc || 'auto',
      bc: c.fbc || 'auto',
      la: c.fla || 'left',
      lz: c.flz || 100,
      tx: c.ftx || ''
    }
  };
}

let animRaf = 0;
function desenharCardAtual() {
  cancelAnimationFrame(animRaf);
  animRaf = requestAnimationFrame(async () => {
    await fontsPromise;
    const c = getCardAtual();
    const cv = document.getElementById('studioCanvas');
    const ar = FORMATS[c.fmt || '4:5'] || (4/5);
    const W = ar > 1 ? 1280 : 880;
    const H = Math.round(W / ar);

    if (cv.width !== W || cv.height !== H) {
      cv.width = W;
      cv.height = H;
    }

    const ctx = cv.getContext('2d');
    renderCard(ctx, W, H, montarCardParaEngine(c), 1, montarOptsParaEngine(c), {});
  });
}

async function renderBlob(c, format = 'image/png', quality = 0.92) {
  await fontsPromise;
  const ar = FORMATS[c.fmt || '4:5'] || (4/5);
  const W = (ar > 1 ? 1920 : 1080) * 2; // Alta resolução 2x Retina
  const H = Math.round(W / ar);
  const cv = document.createElement('canvas');
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext('2d');
  renderCard(ctx, W, H, montarCardParaEngine(c), 1, montarOptsParaEngine(c), {});
  return new Promise(r => cv.toBlob(r, format, quality));
}

/* ═══════════════════════════════════════════════════════════════
   CLICK-TO-EDIT: Clique no canvas → foca o campo correspondente
   ═══════════════════════════════════════════════════════════════ */
function iniciarClickToEdit() {
  const cv = document.getElementById('studioCanvas');
  if (!cv) return;

  cv.addEventListener('click', function(e) {
    const rect = cv.getBoundingClientRect();
    // Converte coordenadas do clique para espaço do canvas
    const scaleX = cv.width / rect.width;
    const scaleY = cv.height / rect.height;
    const cx = (e.clientX - rect.left) * scaleX;
    const cy = (e.clientY - rect.top) * scaleY;
    const W = cv.width, H = cv.height;

    let targetId = null;
    const layout = document.getElementById('selLayout').value;

    // ── Zona do cabeçalho (top ~13%) ──────────────────────────
    if (cy < H * 0.13) {
      targetId = 'inpHandle';
      // Rolar o scroll do right-pane até a seção cabeçalho
      document.getElementById('chkUi').closest('.ctl-group').scrollIntoView({behavior:'smooth', block:'nearest'});
    }
    // ── Zona do rodapé (bottom ~13%) ──────────────────────────
    else if (cy > H * 0.87) {
      targetId = 'selFst';
    }
    // ── Zona central ──────────────────────────────────────────
    else {
      const relY = (cy - H * 0.13) / (H * 0.74); // 0=topo 1=fundo da área central

      if (layout === 'number') {
        // Número fica no topo; cabeçalho abaixo
        if (relY < 0.25) targetId = 'inpNum';
        else if (relY < 0.6) targetId = 'txtHead';
        else targetId = 'txtSup';
      } else if (layout === 'list') {
        if (relY < 0.35) targetId = 'txtHead';
        else targetId = 'txtItems';
      } else if (layout === 'cta') {
        if (relY < 0.45) targetId = 'txtHead';
        else if (relY < 0.68) targetId = 'txtSup';
        else targetId = 'inpCta';
      } else if (layout === 'mega') {
        targetId = relY < 0.55 ? 'txtHead' : 'txtSup';
      } else {
        // statement / quote
        if (relY < 0.5) targetId = 'txtHead';
        else targetId = 'txtSup';
      }
    }

    if (!targetId) return;

    // Foca o campo e aplica flash visual
    const el = document.getElementById(targetId);
    if (!el) return;

    // Garante que o painel da direita está visível (scrolla até o campo)
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Flash + foco após scroll
    setTimeout(() => {
      el.classList.remove('field-flash');
      void el.offsetWidth; // reflow para reiniciar animação
      el.classList.add('field-flash');
      el.focus();
      if (el.select) el.select();
      // Remove a classe após a animação
      el.addEventListener('animationend', () => el.classList.remove('field-flash'), { once: true });
    }, 120);
  });
}
</script>
</body>
</html>
